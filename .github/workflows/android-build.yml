name: Android Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch: {}
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Ensure required SDK platform/build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build_log.txt
          echo "---- outputs dir ----" | tee -a build_log.txt
          find app/build/outputs -type f 2>&1 | tee -a build_log.txt || true

      - name: Save build log
        if: always()
        run: |
          git config user.email "ci@endlesscalendar.local"
          git config user.name "CI Bot"
          mkdir -p /tmp/logsave
          cp build_log.txt /tmp/logsave/build_log.txt || echo "no log produced" > /tmp/logsave/build_log.txt
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/logsave/build_log.txt ./build_log.txt
          git add build_log.txt
          git commit -m "CI log for run ${{ github.run_id }}"
          git push -f origin HEAD:ci-logs

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: endless-calendar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle assembleRelease --stacktrace

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
